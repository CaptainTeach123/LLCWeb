<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Tri-fold printed program for the fictional Maple Hollow Harvest Parade with a cover panel, a route map panel and a lineup and sponsors panel">
  <defs>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d1b19" stop-opacity=".1"/><stop offset=".08" stop-color="#1d1b19" stop-opacity="0"/><stop offset=".92" stop-color="#1d1b19" stop-opacity="0"/><stop offset="1" stop-color="#1d1b19" stop-opacity=".1"/></linearGradient>
  </defs>
  <rect width="600" height="450" fill="#f0e8d9"/>
  <ellipse cx="300" cy="390" rx="250" ry="12" fill="#1d1b19" opacity=".13"/>

  <g transform="translate(60 56)" font-family="Helvetica, Arial, sans-serif">
    <!-- panel 1: cover -->
    <g>
      <rect width="150" height="310" fill="#17625f"/>
      <circle cx="75" cy="120" r="46" fill="#f2b632"/>
      <path d="M0 150q40-26 80-8t70-6v174H0z" fill="#0f4a47"/>
      <g fill="#d2562f"><circle cx="40" cy="206" r="13"/><circle cx="70" cy="212" r="10"/><circle cx="108" cy="204" r="14"/></g>
      <path d="M6 14h138" stroke="#fff6e0" stroke-opacity=".6"/>
      <path d="M12 15h18l-9 18zM42 15h18l-9 18zM72 15h18l-9 18zM102 15h18l-9 18z" fill="#fff6e0" opacity=".85"/>
      <text x="75" y="262" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="19" fill="#fff6e0">Harvest Parade</text>
      <text x="75" y="282" text-anchor="middle" font-size="10" letter-spacing="2" fill="#f2b632" font-weight="700">OFFICIAL PROGRAM</text>
      <text x="75" y="298" text-anchor="middle" font-size="9" fill="#fff6e0" opacity=".8">Maple Hollow · Oct 17</text>
      <rect width="150" height="310" fill="url(#fold)"/>
    </g>
    <!-- panel 2: route -->
    <g transform="translate(155 0)">
      <rect width="150" height="310" fill="#fff6e0"/>
      <text x="14" y="38" font-family="Georgia, serif" font-weight="700" font-size="20" fill="#1d1b19">The Route</text>
      <rect x="14" y="48" width="122" height="3" fill="#d2562f"/>
      <rect x="14" y="66" width="122" height="150" rx="6" fill="#e4ecd8"/>
      <g fill="#fff" opacity=".85"><rect x="14" y="110" width="122" height="10"/><rect x="62" y="66" width="10" height="150"/><rect x="100" y="150" width="36" height="8"/></g>
      <path d="M28 200L28 118 66 118 66 82 118 82" fill="none" stroke="#d2562f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 7"/>
      <circle cx="28" cy="200" r="6" fill="#17625f"/><circle cx="66" cy="118" r="5" fill="#f2b632" stroke="#1d1b19" stroke-width="1.5"/><circle cx="118" cy="82" r="6" fill="#d2562f"/>
      <g font-size="9.5" fill="#1d1b19"><text x="14" y="238"><tspan font-weight="700" fill="#17625f">START</tspan>  Elm Street</text><text x="14" y="256"><tspan font-weight="700" fill="#b6a000">JUDGES</tspan>  Town Square</text><text x="14" y="274"><tspan font-weight="700" fill="#d2562f">FINISH</tspan>  Riverside Park</text></g>
      <text x="14" y="296" font-size="8.5" fill="#5b564f">Road closures begin at 9 AM.</text>
      <rect width="150" height="310" fill="url(#fold)"/>
    </g>
    <!-- panel 3: lineup -->
    <g transform="translate(310 0)">
      <rect width="150" height="310" fill="#fff6e0"/>
      <text x="14" y="38" font-family="Georgia, serif" font-weight="700" font-size="20" fill="#1d1b19">The Lineup</text>
      <rect x="14" y="48" width="122" height="3" fill="#17625f"/>
      <g font-size="10">
        <g font-weight="700" fill="#d2562f"><text x="14" y="76">10:00</text><text x="14" y="102">10:10</text><text x="14" y="128">10:25</text><text x="14" y="154">10:40</text></g>
        <g fill="#1d1b19"><text x="52" y="76">Marching band</text><text x="52" y="102">Antique tractors</text><text x="52" y="128">Scout Troop 14</text><text x="52" y="154">Pumpkin floats</text></g>
        <path d="M14 84h122M14 110h122M14 136h122" stroke="#1d1b19" stroke-opacity=".12"/>
      </g>
      <text x="14" y="196" font-size="9" font-weight="700" letter-spacing="1.5" fill="#5b564f">THANKS TO OUR SPONSORS</text>
      <g fill="#f0e8d9" stroke="#1d1b19" stroke-opacity=".3">
        <rect x="14" y="206" width="56" height="30" rx="5"/><rect x="80" y="206" width="56" height="30" rx="5"/>
        <rect x="14" y="244" width="56" height="30" rx="5"/><rect x="80" y="244" width="56" height="30" rx="5"/>
      </g>
      <g font-family="Georgia, serif" font-weight="700" font-size="10" fill="#17625f" text-anchor="middle"><text x="42" y="225">Hollow Bank</text><text x="108" y="225">Rae's Diner</text><text x="42" y="263">Fork &amp; Co.</text><text x="108" y="263">Elm Hardware</text></g>
      <rect width="150" height="310" fill="url(#fold)"/>
    </g>
  </g>
  <text x="300" y="424" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b564f">Tri-fold program · print-ready, sized for any local printer</text>
</svg>
