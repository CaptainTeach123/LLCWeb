<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Print flyer with crop marks, a square social media post and color swatches for the fictional Cedar Creek Farmers Market brand kit">
  <rect width="600" height="450" fill="#f0e8d9"/>

  <!-- flyer -->
  <g transform="translate(46 40)">
    <rect x="6" y="8" width="200" height="290" fill="#1d1b19" opacity=".16"/>
    <rect width="200" height="290" fill="#fff6e0"/>
    <rect width="200" height="120" fill="#5b7f2e"/>
    <g fill="#d2562f"><circle cx="38" cy="98" r="15"/><circle cx="72" cy="104" r="12"/><circle cx="160" cy="100" r="16"/></g>
    <g fill="#3f5c1e"><path d="M30 80q8-6 16 0-8 4-16 0zM152 82q8-6 16 0-8 4-16 0z"/></g>
    <circle cx="118" cy="104" r="11" fill="#f2b632"/>
    <text x="100" y="46" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#fff6e0">CEDAR CREEK</text>
    <text x="100" y="68" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#fff6e0">Farmers Market</text>
    <text x="100" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="3" fill="#1d1b19">SATURDAYS</text>
    <text x="100" y="190" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#d2562f">8 AM – 1 PM</text>
    <path d="M70 204h60" stroke="#1d1b19" stroke-width="1.5"/>
    <text x="100" y="224" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b564f">Fresh produce · Live music</text>
    <text x="100" y="241" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b564f">Riverside Park, Lot B</text>
    <rect y="262" width="200" height="28" fill="#5b7f2e"/>
    <text x="100" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="11" fill="#fff">Free parking · Dogs welcome</text>
    <!-- crop marks -->
    <g stroke="#1d1b19" stroke-width="1">
      <path d="M-16 0h-6M0 -16v-6M216 0h6M200 -16v-6M-16 290h-6M0 306v6M216 290h6M200 306v6"/>
    </g>
    <text x="100" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b564f">Print-ready · bleed &amp; crop marks</text>
  </g>

  <!-- social square -->
  <g transform="translate(290 40)">
    <rect x="6" y="8" width="240" height="240" rx="12" fill="#1d1b19" opacity=".16"/>
    <rect width="240" height="240" rx="12" fill="#f2b632"/>
    <circle cx="190" cy="186" r="44" fill="#d2562f"/>
    <path d="M178 148q12-12 24 0-12 8-24 0z" fill="#5b7f2e"/>
    <circle cx="48" cy="212" r="22" fill="#5b7f2e"/>
    <text x="24" y="52" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="3" fill="#1d1b19">SATURDAYS</text>
    <text x="20" y="128" font-family="Georgia, serif" font-weight="700" font-size="78" fill="#1d1b19">8–1</text>
    <text x="24" y="160" font-family="Georgia, serif" font-weight="700" font-size="20" fill="#1d1b19">Cedar Creek</text>
    <text x="24" y="182" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#1d1b19">Farmers Market</text>
  </g>
  <text x="410" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b564f">Matching social graphic</text>

  <!-- swatches -->
  <g stroke="#1d1b19" stroke-width="2">
    <circle cx="316" cy="362" r="18" fill="#5b7f2e"/><circle cx="364" cy="362" r="18" fill="#d2562f"/>
    <circle cx="412" cy="362" r="18" fill="#f2b632"/><circle cx="460" cy="362" r="18" fill="#fff6e0"/>
    <circle cx="508" cy="362" r="18" fill="#1d1b19"/>
  </g>
  <text x="410" y="408" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="1" fill="#1d1b19">BRAND KIT · COLORS, FONTS, LOGO</text>
</svg>
