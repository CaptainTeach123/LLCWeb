<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Website mockup for the fictional Cedar Creek Bakery on a desktop browser and a tablet, showing a hero with an order-ahead button, a menu grid and opening hours">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="125%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#1d1b19" flood-opacity=".18"/></filter>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3a65b"/><stop offset="1" stop-color="#b8702f"/></linearGradient>
    <clipPath id="tab"><rect x="8" y="8" width="164" height="224" rx="10"/></clipPath>
  </defs>
  <rect width="600" height="450" fill="#f0e8d9"/>

  <!-- browser -->
  <g transform="translate(28 36)" filter="url(#sh)" font-family="Helvetica, Arial, sans-serif">
    <rect width="420" height="330" rx="12" fill="#fff"/>
    <path d="M0 12a12 12 0 0 1 12-12h396a12 12 0 0 1 12 12v18H0z" fill="#1d1b19"/>
    <circle cx="18" cy="15" r="4" fill="#d2562f"/><circle cx="32" cy="15" r="4" fill="#f2b632"/><circle cx="46" cy="15" r="4" fill="#4fb3ab"/>
    <rect x="72" y="8" width="190" height="14" rx="7" fill="#faf6ef" opacity=".2"/>
    <text x="80" y="18" font-size="8" fill="#faf6ef" opacity=".7">cedarcreekbakery.com</text>
    <!-- nav -->
    <text x="18" y="52" font-family="Georgia, serif" font-weight="700" font-size="13" fill="#1d1b19">Cedar Creek Bakery</text>
    <g font-size="8.5" fill="#5b564f"><text x="262" y="52">Menu</text><text x="294" y="52">Catering</text><text x="336" y="52">Hours</text></g>
    <rect x="364" y="42" width="40" height="15" rx="7.5" fill="#d2562f"/>
    <text x="384" y="52.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff">Order</text>
    <!-- hero -->
    <rect y="64" width="420" height="124" fill="#5b7f2e"/>
    <circle cx="340" cy="126" r="48" fill="#e9dcc0"/>
    <g transform="translate(340 128)">
      <ellipse rx="40" ry="24" fill="url(#crust)"/>
      <path d="M-30 -8q10-10 20 0M-10 -10q10-10 20 0M10 -8q10-10 20 0" stroke="#8a4f1c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <text x="24" y="104" font-family="Georgia, serif" font-weight="700" font-size="26" fill="#fff6e0">Baked before</text>
    <text x="24" y="130" font-family="Georgia, serif" font-weight="700" font-size="26" fill="#f2b632">sunrise.</text>
    <text x="24" y="150" font-size="9.5" fill="#fff6e0" opacity=".9">Sourdough, pastries and cakes made in Cedar Creek.</text>
    <rect x="24" y="160" width="86" height="18" rx="9" fill="#f2b632"/>
    <text x="67" y="172" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1d1b19">Order ahead</text>
    <!-- menu grid -->
    <text x="18" y="212" font-family="Georgia, serif" font-weight="700" font-size="13" fill="#1d1b19">This week's menu</text>
    <g>
      <rect x="18" y="222" width="90" height="82" rx="8" fill="#f8f3ea"/>
      <rect x="117" y="222" width="90" height="82" rx="8" fill="#f8f3ea"/>
      <rect x="216" y="222" width="90" height="82" rx="8" fill="#f8f3ea"/>
      <!-- bread -->
      <ellipse cx="63" cy="250" rx="26" ry="15" fill="url(#crust)"/>
      <!-- croissant -->
      <path d="M140 258q22-26 44 0q-10 6-22 6t-22-6z" fill="#e3a65b"/>
      <path d="M150 250l-4 10M162 246v12M174 250l4 10" stroke="#b8702f" stroke-width="2" stroke-linecap="round"/>
      <!-- cake -->
      <rect x="243" y="240" width="36" height="22" rx="3" fill="#f3c7c0"/>
      <rect x="243" y="236" width="36" height="7" rx="3" fill="#fff"/>
      <circle cx="261" cy="233" r="3.5" fill="#d2562f"/>
      <g font-size="8.5" font-weight="700" fill="#1d1b19"><text x="28" y="282">Country loaf</text><text x="127" y="282">Butter croissant</text><text x="226" y="282">Celebration cake</text></g>
      <g font-size="8" fill="#5b564f"><text x="28" y="295">$8 · daily</text><text x="127" y="295">$4 · Tue–Sun</text><text x="226" y="295">from $38 · order 3 days</text></g>
    </g>
    <!-- hours card -->
    <rect x="316" y="222" width="86" height="82" rx="8" fill="#17625f"/>
    <text x="328" y="240" font-size="7.5" font-weight="700" letter-spacing="1.5" fill="#f2b632">HOURS</text>
    <g font-size="8" fill="#fff6e0"><text x="328" y="256">Tue–Fri  7–3</text><text x="328" y="270">Sat  7–1</text><text x="328" y="284">Sun–Mon  closed</text></g>
    <text x="328" y="298" font-size="7.5" fill="#fff6e0" opacity=".8">14 Mill St · Cedar Creek</text>
  </g>

  <!-- tablet -->
  <g transform="translate(400 160)" filter="url(#sh)" font-family="Helvetica, Arial, sans-serif">
    <rect width="180" height="240" rx="16" fill="#1d1b19"/>
    <rect x="8" y="8" width="164" height="224" rx="10" fill="#fff"/>
    <g clip-path="url(#tab)">
      <rect x="8" y="8" width="164" height="30" fill="#5b7f2e"/>
      <text x="20" y="27" font-family="Georgia, serif" font-weight="700" font-size="10.5" fill="#fff6e0">Order ahead</text>
      <g font-size="8" fill="#1d1b19">
        <g><rect x="18" y="48" width="144" height="28" rx="6" fill="#f8f3ea"/><text x="26" y="60" font-weight="700">Country loaf</text><text x="26" y="70" fill="#5b564f">Sourdough · 900g</text><text x="150" y="65" text-anchor="end" font-weight="700">$8</text></g>
        <g><rect x="18" y="82" width="144" height="28" rx="6" fill="#f8f3ea"/><text x="26" y="94" font-weight="700">Seeded rye</text><text x="26" y="104" fill="#5b564f">Caraway · 800g</text><text x="150" y="99" text-anchor="end" font-weight="700">$9</text></g>
        <g><rect x="18" y="116" width="144" height="28" rx="6" fill="#f8f3ea"/><text x="26" y="128" font-weight="700">Cinnamon rolls</text><text x="26" y="138" fill="#5b564f">Box of 4</text><text x="150" y="133" text-anchor="end" font-weight="700">$14</text></g>
        <g><rect x="18" y="150" width="144" height="28" rx="6" fill="#f8f3ea"/><text x="26" y="162" font-weight="700">Celebration cake</text><text x="26" y="172" fill="#5b564f">8" · serves 12</text><text x="150" y="167" text-anchor="end" font-weight="700">$38</text></g>
      </g>
      <rect x="18" y="194" width="144" height="24" rx="12" fill="#d2562f"/>
      <text x="90" y="210" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Pick up Saturday · $22</text>
    </g>
  </g>
</svg>
