<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Event display set for the fictional Lantern Night Festival: a photo backdrop banner with a repeating lantern pattern, an A-frame sidewalk sign and a table tent card">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="125%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1d1b19" flood-opacity=".2"/></filter>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1838"/><stop offset="1" stop-color="#3a2a5c"/></linearGradient>
    <pattern id="lanterns" width="52" height="60" patternUnits="userSpaceOnUse">
      <ellipse cx="14" cy="16" rx="7" ry="9" fill="#f2b632" opacity=".9"/>
      <path d="M14 7v-5" stroke="#f2b632" stroke-width="1.5"/>
      <ellipse cx="40" cy="44" rx="7" ry="9" fill="#ee7449" opacity=".85"/>
      <path d="M40 35v-5" stroke="#ee7449" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="#f0e8d9"/>
  <rect y="372" width="600" height="78" fill="#e2d8c3"/>

  <!-- backdrop banner on stand -->
  <g transform="translate(40 40)">
    <rect x="-4" y="-6" width="320" height="10" rx="3" fill="#3a3631"/>
    <rect x="8" y="0" width="6" height="340" fill="#3a3631"/>
    <rect x="298" y="0" width="6" height="340" fill="#3a3631"/>
    <path d="M-10 346h40M282 346h40" stroke="#3a3631" stroke-width="6" stroke-linecap="round"/>
    <g filter="url(#sh)">
      <rect x="14" y="4" width="284" height="300" fill="url(#night)"/>
      <rect x="14" y="4" width="284" height="300" fill="url(#lanterns)"/>
      <rect x="14" y="4" width="284" height="300" fill="#1b1838" opacity=".35"/>
    </g>
    <!-- centered logo lockup -->
    <g transform="translate(156 150)">
      <circle r="58" fill="#1b1838" opacity=".85"/>
      <circle r="58" fill="none" stroke="#f2b632" stroke-width="2"/>
      <ellipse cy="-14" rx="16" ry="21" fill="#f2b632"/>
      <path d="M0 -35v-9" stroke="#f2b632" stroke-width="2.5"/>
      <text y="26" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="13" fill="#fff6e0">LANTERN NIGHT</text>
      <text y="42" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#f2b632">Festival</text>
    </g>
    <text x="156" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5b564f">8 × 8 ft photo backdrop · repeat pattern</text>
  </g>

  <!-- A-frame sign -->
  <g transform="translate(400 160)" filter="url(#sh)">
    <path d="M30 0h100l30 190H0z" fill="#fff6e0" stroke="#1d1b19" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M130 0l44 190h-14L130 0z" fill="#cfc3a8" stroke="#1d1b19" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="22" y="14" width="116" height="156" fill="url(#night)"/>
    <rect x="22" y="14" width="116" height="156" fill="url(#lanterns)" opacity=".5"/>
    <ellipse cx="80" cy="60" rx="18" ry="24" fill="#f2b632"/>
    <path d="M80 36v-10" stroke="#f2b632" stroke-width="3"/>
    <text x="80" y="104" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="13" fill="#fff6e0">Lantern walk</text>
    <text x="80" y="120" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="13" fill="#fff6e0">starts here</text>
    <path d="M60 144h40m-10-10l10 10-10 10" fill="none" stroke="#f2b632" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="488" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5b564f">A-frame sidewalk sign</text>

  <!-- table tent -->
  <g transform="translate(410 392)" filter="url(#sh)">
    <path d="M0 40L36 0h74l36 40z" fill="#cfc3a8"/>
    <path d="M36 0h74v40H36z" fill="url(#night)"/>
    <ellipse cx="60" cy="18" rx="6" ry="8" fill="#f2b632"/>
    <text x="72" y="16" font-family="Georgia, serif" font-weight="700" font-size="8" fill="#fff6e0">TABLE 7</text>
    <text x="72" y="28" font-family="Helvetica, Arial, sans-serif" font-size="6.5" fill="#f2b632">Rae's Diner</text>
  </g>
  <text x="488" y="446" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5b564f">Vendor table tents</text>
</svg>
