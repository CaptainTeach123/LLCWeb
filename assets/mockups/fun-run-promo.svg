<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Promo set for the fictional Riverside Fun Run 5K: a social media story, a web banner and a race bib">
  <rect width="600" height="450" fill="#f0e8d9"/>

  <!-- story -->
  <g transform="translate(36 36)" font-family="Helvetica, Arial, sans-serif">
    <rect x="6" y="8" width="170" height="302" rx="16" fill="#1d1b19" opacity=".16"/>
    <rect width="170" height="302" rx="16" fill="#d2562f"/>
    <circle cx="85" cy="112" r="56" fill="#f2b632"/>
    <path d="M0 208q42-24 84-8t86-10v112H0z" fill="#17625f"/>
    <path d="M0 238q50-18 100-4t70-6v74H0z" fill="#0f4a47"/>
    <!-- runner -->
    <g transform="translate(86 96)" stroke="#1d1b19" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="6" cy="-24" r="8" fill="#1d1b19" stroke="none"/>
      <path d="M4 -10L-4 22"/><path d="M0 2L-18 12M0 2L18 -6"/><path d="M-4 22L-22 40L-34 34M-4 22L16 34L14 52"/>
    </g>
    <text x="85" y="40" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="3" fill="#fff6e0">SAT · NOV 14</text>
    <text x="85" y="236" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#fff6e0">Riverside</text>
    <text x="85" y="258" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#fff6e0">Fun Run 5K</text>
    <rect x="26" y="270" width="118" height="22" rx="11" fill="#f2b632"/>
    <text x="85" y="285" text-anchor="middle" font-size="11" font-weight="700" fill="#1d1b19">Register today</text>
  </g>
  <text x="121" y="362" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b564f">Social story</text>

  <!-- web banner -->
  <g transform="translate(232 44)" font-family="Helvetica, Arial, sans-serif">
    <rect x="5" y="7" width="332" height="118" rx="12" fill="#1d1b19" opacity=".16"/>
    <rect width="332" height="118" rx="12" fill="#17625f"/>
    <circle cx="288" cy="40" r="42" fill="#f2b632" opacity=".95"/>
    <path d="M200 118q40-34 84-14t48-4v18z" fill="#0f4a47"/>
    <text x="22" y="40" font-size="10" font-weight="700" letter-spacing="2" fill="#f2b632">RIVERSIDE FUN RUN · 5K</text>
    <text x="22" y="68" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#fff6e0">Run the river.</text>
    <text x="22" y="90" font-size="12" fill="#fff6e0" opacity=".9">Register by Nov 1 and save $5.</text>
  </g>
  <text x="398" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b564f">Web banner</text>

  <!-- race bib -->
  <g transform="translate(264 222) rotate(-4)" font-family="Helvetica, Arial, sans-serif">
    <rect x="6" y="8" width="230" height="150" rx="6" fill="#1d1b19" opacity=".16"/>
    <rect width="230" height="150" rx="6" fill="#fff" stroke="#1d1b19" stroke-width="2"/>
    <rect width="230" height="30" rx="6" fill="#d2562f"/>
    <rect y="22" width="230" height="8" fill="#d2562f"/>
    <text x="115" y="21" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2.5" fill="#fff">RIVERSIDE FUN RUN</text>
    <text x="115" y="106" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="64" fill="#1d1b19">1204</text>
    <text x="115" y="132" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="3" fill="#17625f">5K · NOV 14</text>
    <g fill="#f0e8d9" stroke="#1d1b19" stroke-opacity=".5"><circle cx="14" cy="44" r="5"/><circle cx="216" cy="44" r="5"/><circle cx="14" cy="136" r="5"/><circle cx="216" cy="136" r="5"/></g>
  </g>
  <text x="380" y="420" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5b564f">Race bib</text>
</svg>
